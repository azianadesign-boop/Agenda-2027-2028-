<style>
/* Agenda 2027–2028 — application web, même structure et même style que l'agenda PDF.
   Feuille blanche, traits fins, petites capitales espacées, onglets fins à droite (iPad / ordinateur),
   barre d'onglets en bas (téléphone). Coloris via [data-coloris], thème via [data-theme]. */
:root[data-coloris="lavande"] { --tab: #EFECF3; --tab2: #E3DDEB; --acc: #8E80A8; --deep: #4A4060; --soft: #F7F5FA; --mark: #D9D0E6; }
:root[data-coloris="sauge"] { --tab: #ECF0E9; --tab2: #DEE5DA; --acc: #7F927A; --deep: #44523F; --soft: #F5F7F3; --mark: #CDD8C8; }
:root[data-coloris="rose"] { --tab: #F5EDEB; --tab2: #EBDCD8; --acc: #B48A82; --deep: #6B4A45; --soft: #FAF5F4; --mark: #E7D2CD; }
:root[data-coloris="noir"] { --tab: #EEEDEB; --tab2: #E0DEDB; --acc: #3E3B38; --deep: #1E1D1B; --soft: #F6F5F4; --mark: #CFCBC6; }
:root[data-coloris="framboise"] { --tab: #F9EAF0; --tab2: #F2D4DF; --acc: #C83A6C; --deep: #7A1E40; --soft: #FDF5F8; --mark: #EDB6CA; }
:root[data-coloris="corail"] { --tab: #FCEDE8; --tab2: #F7D8CE; --acc: #DD5B3B; --deep: #8A3420; --soft: #FEF7F4; --mark: #F3B7A6; }
:root[data-coloris="soleil"] { --tab: #FBF3DE; --tab2: #F4E3B4; --acc: #B88A0B; --deep: #6E4F00; --soft: #FEFAEF; --mark: #EDD08A; }
:root[data-coloris="emeraude"] { --tab: #E6F4EE; --tab2: #CBE8DB; --acc: #1A8F64; --deep: #0E5038; --soft: #F3FAF7; --mark: #A5D9C2; }
:root[data-coloris="turquoise"] { --tab: #E3F4F5; --tab2: #C6E8EA; --acc: #0F959D; --deep: #0A5558; --soft: #F2FAFA; --mark: #9AD7DB; }
:root[data-coloris="ocean"] { --tab: #E6EDF9; --tab2: #CEDCF3; --acc: #2C66CC; --deep: #183A7A; --soft: #F4F7FD; --mark: #ABC4EF; }
:root[data-coloris="violet"] { --tab: #F0E9F9; --tab2: #E0D2F3; --acc: #7442CC; --deep: #44227D; --soft: #F8F4FD; --mark: #C9B3EF; }
:root[data-coloris="peche"] { --tab: #FCF1EB; --tab2: #F6E1D6; --acc: #D08A6E; --deep: #8A5640; --soft: #FEF9F6; --mark: #F1CDBD; }
:root[data-coloris="poudre"] { --tab: #FAF0F2; --tab2: #F2E0E4; --acc: #C68C9A; --deep: #845560; --soft: #FDF8F9; --mark: #EBCAD2; }
:root[data-coloris="vanille"] { --tab: #FAF5E8; --tab2: #F2E9D0; --acc: #B39858; --deep: #77643A; --soft: #FDFBF4; --mark: #E6D8AE; }
:root[data-coloris="menthe"] { --tab: #EBF6F0; --tab2: #D7ECE1; --acc: #5FA483; --deep: #3F735A; --soft: #F6FBF8; --mark: #BCDFCC; }
:root[data-coloris="ciel"] { --tab: #EBF3FA; --tab2: #D7E7F4; --acc: #6A9AC8; --deep: #3F6589; --soft: #F6FAFD; --mark: #BFD7EE; }
:root[data-coloris="demoiselle"] { --tab: #ECEDF7; --tab2: #DCDEF1; --acc: #7A80BF; --deep: #3E4377; --soft: #F6F7FC; --mark: #BBBFDF; }
:root[data-coloris="lilas"] { --tab: #F3EFF9; --tab2: #E6DEF2; --acc: #9884C6; --deep: #64538A; --soft: #FAF8FD; --mark: #D7CCEC; }
:root {
  --bg: #F6F4F1; --sheet: #FFFFFF; --ink: #47423E; --muted: #9B938B; --line: #E8E3DD; --soft: #F5F2EE;
  --tab: #ECE7E1; --tab2: #E1DAD1; --acc: #A08F80; --deep: #5B5048; --mark: #D9CEC2; --on: #FFFFFF; --hl: var(--mark);
  --f-serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --f-sans: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-script: "Parisienne", "Snell Roundhand", "Brush Script MT", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141312; --sheet: #1C1A19; --ink: #EEE8E1; --muted: #A0978E; --line: #34302D; --soft: #262321; --on: #1C1A19; --hl: color-mix(in srgb, var(--mark) 38%, #1C1A19);
    --tab: color-mix(in srgb, var(--mark) 22%, #1C1A19); --tab2: color-mix(in srgb, var(--mark) 30%, #1C1A19);
    --deep: color-mix(in srgb, var(--mark) 70%, #FFFFFF); --acc: color-mix(in srgb, var(--mark) 85%, #FFFFFF);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141312; --sheet: #1C1A19; --ink: #EEE8E1; --muted: #A0978E; --line: #34302D; --soft: #262321; --on: #1C1A19; --hl: color-mix(in srgb, var(--mark) 38%, #1C1A19);
  --tab: color-mix(in srgb, var(--mark) 22%, #1C1A19); --tab2: color-mix(in srgb, var(--mark) 30%, #1C1A19);
  --deep: color-mix(in srgb, var(--mark) 70%, #FFFFFF); --acc: color-mix(in srgb, var(--mark) 85%, #FFFFFF);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--sheet); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -.14em; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.caps { font-family: var(--f-sans); font-weight: 500; text-transform: uppercase; letter-spacing: .18em; font-size: 10px; color: var(--muted); }
.serif { font-family: var(--f-serif); font-weight: 400; }
.script { font-family: var(--f-script); color: var(--acc); }

/* ---------- barre haute ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 18px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; flex-direction: column; line-height: 1.05; flex: none; }
.brand b { font-weight: 500; font-size: 10px; letter-spacing: .32em; color: var(--deep); }
.brand span { font-family: var(--f-script); color: var(--acc); font-size: 15px; }
.nav { display: flex; gap: 16px; flex-wrap: wrap; flex: 1; }
.nav button { font-weight: 500; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding: 6px 0; border-bottom: 1px solid transparent; }
.nav button.on { color: var(--deep); border-color: var(--acc); }
.tools { display: flex; gap: 6px; margin-left: auto; }
.tool { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; color: var(--deep); font-size: 15px; }
.tool:hover { background: var(--soft); }
.save { font-size: 10px; color: var(--muted); letter-spacing: .1em; min-width: 70px; text-align: right; }

/* ---------- feuille + onglets ---------- */
.wrap { display: flex; justify-content: center; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.sheet { position: relative; width: 100%; max-width: 900px; background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; box-shadow: 0 30px 60px -45px rgba(60, 45, 30, .45); }
.page { padding: 34px 54px 30px 40px; min-height: 70vh; min-width: 0; }
.tabs { position: absolute; top: 18px; right: -30px; display: flex; flex-direction: column; gap: 3px; width: 30px; }
.tabs button { writing-mode: vertical-rl; font-weight: 500; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--deep); background: var(--tab);
  border-radius: 0 5px 5px 0; padding: 12px 0; width: 26px; text-align: center; transition: width .15s ease; }
.tabs button:nth-child(even) { background: var(--tab2); }
.tabs button.yr { background: var(--tab2); padding: 14px 0; }
.tabs button.yr.on { background: var(--deep); color: var(--on); }
.tabs button.on { background: var(--acc); color: var(--on); width: 30px; }
.tabs .gap { height: 8px; }
.crumbs { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 54px 22px 40px; flex-wrap: wrap; }
.crumbs nav { display: flex; gap: 16px; }
.crumbs button { font-weight: 500; font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.crumbs button.on { color: var(--deep); border-bottom: 1px solid var(--acc); }

/* ---------- en-têtes de page ---------- */
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.ph h1 { font-family: var(--f-serif); font-weight: 400; font-size: 40px; line-height: 1; margin: 0; text-wrap: balance; }
.ph h1 em { font-style: italic; color: var(--acc); font-size: .66em; margin-left: 8px; }
.ph h1 .sc { font-family: var(--f-script); color: var(--acc); font-size: .62em; margin-left: 10px; font-style: normal; }
.ph .sub { margin-top: 8px; }
.ph .eyebrow { color: var(--acc); letter-spacing: .3em; margin-bottom: 6px; }
.phr { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.links button, .links span { font-weight: 500; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding-bottom: 2px; }
.links button.on { color: var(--deep); border-bottom: 1px solid var(--acc); }
.links button:hover { color: var(--deep); }
.arrows { display: flex; gap: 6px; }
.arrows button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--deep); }
.arrows button:disabled { opacity: .3; cursor: default; }

/* ---------- blocs ---------- */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px 30px; align-items: start; }
.grid2.w { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.col { display: grid; gap: 24px; min-width: 0; align-content: start; }
.full { display: grid; gap: 24px; margin-top: 24px; }
.blk { min-width: 0; }
.lab { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.lab .ic { color: var(--acc); font-size: 12px; }
.lab span { font-weight: 500; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--deep); white-space: nowrap; }
.lab::after { content: ""; flex: 1; height: 1px; background: var(--line); margin-left: 4px; }
.ln { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); min-height: 30px; }
.ln :is(input[type=text], textarea.w) { flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px 2px; outline: none; font-size: 14px; }
.ln .n { font-size: 11px; color: var(--acc); width: 14px; text-align: center; font-weight: 500; }
.ln .hr { font-size: 11px; color: var(--muted); width: 26px; font-variant-numeric: tabular-nums; }
.ln.half { border-bottom-style: dotted; min-height: 24px; }
.ln.half :is(input, textarea.w) { font-size: 13px; padding: 3px 2px; }
.ck { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1px solid var(--muted); border-radius: 3px; margin: 0; flex: none; display: grid; place-items: center; cursor: pointer; }
.ck.r { border-radius: 50%; }
.ck:checked { background: var(--acc); border-color: var(--acc); }
.ck:checked::after { content: ""; width: 7px; height: 4px; border: 1.6px solid var(--on); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.ln.done :is(input[type=text], textarea.w) { color: var(--muted); text-decoration: line-through; }
.pill { background: var(--soft); border-radius: 999px; border-bottom: 0; margin-bottom: 6px; padding-left: 10px; }
textarea.ta { width: 100%; border: 0; resize: vertical; background: transparent; outline: none; font-size: 14px; line-height: 28px; padding: 0 2px; min-height: 112px;
  background-image: linear-gradient(to bottom, transparent 27px, var(--line) 27px); background-size: 100% 28px; background-attachment: local; }
textarea.ta.box { background: var(--soft); border-radius: 6px; padding: 10px 12px; background-image: none; line-height: 1.6; }
textarea.ta.dots { background-image: radial-gradient(circle, color-mix(in srgb, var(--line) 70%, var(--muted)) .8px, transparent 1.2px); background-size: 16px 16px; line-height: 24px; padding: 8px; }
textarea.ta.grid { background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 16px 16px; line-height: 24px; padding: 8px; }
textarea.ta.plain { background-image: none; border: 1px solid var(--line); border-radius: 4px; padding: 10px; line-height: 1.6; }
.fld { display: grid; grid-template-columns: 110px 1fr; align-items: end; border-bottom: 1px solid var(--line); min-height: 30px; }
.fld label { font-weight: 500; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding-bottom: 7px; }
.fld :is(input, textarea.w) { border: 0; background: transparent; outline: none; padding: 6px 2px; min-width: 0; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { background: var(--soft); font-weight: 500; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--deep); padding: 6px 4px; text-align: left; }
table.t td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; }
table.t td:last-child { border-right: 0; }
table.t td :is(input, textarea.w) { width: 100%; border: 0; background: transparent; outline: none; padding: 6px 6px; min-width: 60px; }
table.t td.pre { padding: 6px; color: var(--muted); white-space: nowrap; }
table.t tfoot td { font-weight: 500; color: var(--deep); padding: 7px 6px; border-bottom: 0; font-variant-numeric: tabular-nums; }
.trk { border-collapse: collapse; font-size: 11px; }
.trk th { font-weight: 400; color: var(--muted); font-size: 9.5px; padding: 2px 0; min-width: 20px; text-align: center; }
.trk td { padding: 2px 1px; text-align: center; }
.trk td.rl { text-align: left; padding-right: 8px; white-space: nowrap; }
.trk td.rl :is(input, textarea.w) { border: 0; border-bottom: 1px solid var(--line); background: transparent; outline: none; width: 120px; padding: 3px 0; font-size: 12px; }
.trk .c { width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--mark); display: inline-block; vertical-align: middle; }
.trk .c.sq { border-radius: 3px; }
.trk .c.on { background: var(--acc); border-color: var(--acc); }
.trk .c.on2 { background: var(--mark); border-color: var(--mark); }
.trk tr.band td { background: var(--soft); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mood button { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; color: var(--acc); font-size: 20px; }
.mood button.on { background: var(--acc); color: var(--on); }
.drop { color: var(--mark); font-size: 20px; }
.drop.on { color: var(--acc); }
.drop.on .ic { fill: currentColor; }
.dot10 button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.dot10 button.on { background: var(--acc); color: var(--on); border-color: var(--acc); }
.stars button { color: var(--mark); font-size: 18px; }
.stars button.on { color: var(--acc); }
.stars button.on .ic { fill: currentColor; }
.prog { display: flex; gap: 4px; }
.prog button { flex: 1; height: 12px; border: 1px solid var(--line); border-radius: 3px; }
.prog button.on { background: var(--acc); border-color: var(--acc); }
.photo { position: relative; background: var(--soft); border-radius: 4px; display: grid; place-items: center; color: var(--muted); overflow: hidden; cursor: pointer; border: 1px solid var(--line); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .ph-in { display: grid; justify-items: center; gap: 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.photo .ph-in .ic { font-size: 22px; }
.photo .del { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, .45); color: #fff; display: grid; place-items: center; z-index: 2; }
.photos { display: grid; gap: 12px; }
.polaroid { background: var(--sheet); padding: 8px 8px 0; border: 1px solid var(--line); box-shadow: 0 8px 18px -12px rgba(0, 0, 0, .35); }
.polaroid :is(input, textarea.w) { width: 100%; border: 0; background: transparent; outline: none; text-align: center; font-family: var(--f-serif); font-style: italic; padding: 6px 0 8px; font-size: 15px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.static p { margin: 0 0 8px; }

/* ---------- calendriers ---------- */
.mini { min-width: 0; }
.mini h4 { margin: 0 0 6px; text-align: center; font-family: var(--f-serif); font-weight: 500; font-size: 17px; cursor: pointer; }
.mini .g { display: grid; grid-template-columns: 16px repeat(7, 1fr); row-gap: 2px; }
.mini .g span { text-align: center; font-size: 9px; color: var(--muted); font-weight: 500; }
.mini .g .wk { font-size: 8.5px; color: var(--acc); align-self: center; cursor: pointer; }
.mini .g button { aspect-ratio: 1; border-radius: 50%; font-size: 11.5px; font-variant-numeric: tabular-nums; max-width: 100%; }
.mini .g button:hover { background: var(--soft); }
.mini .g button.fer { background: var(--hl); }
.mini .g button.we { color: var(--muted); }
.mini .g button.sel { background: var(--deep); color: var(--on); }
.mini .g button.today { box-shadow: inset 0 0 0 1.5px var(--acc); }
.yeargrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px 30px; }
.mcal { display: grid; grid-template-columns: 22px repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--muted); }
.mcal .dh { text-align: center; padding: 6px 0; font-weight: 500; font-size: 9.5px; letter-spacing: .16em; color: var(--deep); border-bottom: 1px solid var(--muted); }
.mcal .wn { font-size: 9px; color: var(--acc); display: grid; place-items: center; border-bottom: 1px solid var(--line); cursor: pointer; }
.mcal .cell { min-height: 92px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mcal .cell:hover { background: var(--soft); }
.mcal .cell.we { background: color-mix(in srgb, var(--soft) 70%, transparent); }
.mcal .cell.out { color: var(--line); }
.mcal .cell .num { font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.mcal .cell.fer .num b { background: var(--hl); border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; font-weight: 500; }
.mcal .cell .ev { font-size: 9.5px; color: var(--muted); line-height: 1.2; }
.mcal .cell .ev.f { color: var(--deep); font-weight: 500; }
.mcal .cell .pv { font-size: 10.5px; color: var(--ink); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcal .cell.today .num b, .mcal .cell.today .num > span:first-child { color: var(--acc); font-weight: 600; }
.moon { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--acc); display: inline-block; }
.moon.nouvelle { background: var(--acc); }
.moon.premier { background: linear-gradient(90deg, transparent 50%, var(--acc) 50%); }

/* ---------- champs d'écriture : le texte revient à la ligne au lieu de sortir ---------- */
textarea.w { display: block; flex: 1; width: 100%; min-width: 0; border: 0; background: transparent; outline: none; resize: none; overflow: hidden;
  padding: 6px 2px; margin: 0; line-height: 1.45; font-size: 14px; color: inherit; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; -webkit-appearance: none; appearance: none; border-radius: 0; }
textarea.w::placeholder { color: var(--muted); opacity: .7; }
/* rangées : la hauteur vient du texte (une ligne = une rangée, le texte long ajoute des lignes) */
:root { --lh: 22px; --lnpad: 4px; }
:root[data-vis="equilibree"] { --lnpad: 5.5px; }
:root[data-vis="nette"] { --lnpad: 7px; }
.ln { align-items: flex-start; min-height: 0 !important; }
.ln.half { --lh: 20px; --lnpad: 2px; }
:root[data-vis="equilibree"] .ln.half { --lnpad: 3px; }
:root[data-vis="nette"] .ln.half { --lnpad: 4px; }
.ln > textarea.w, .ln > input[type=text] { line-height: var(--lh); padding-top: var(--lnpad); padding-bottom: var(--lnpad); }
.ln > .ck { margin-top: calc(var(--lnpad) + (var(--lh) - 1em) / 2); font-size: 14px; }
:root[data-vis="equilibree"] .ln > .ck { font-size: 16px; }
:root[data-vis="nette"] .ln > .ck { font-size: 18px; }
.ln > .n, .ln > .hr { line-height: var(--lh); padding-top: var(--lnpad); padding-bottom: var(--lnpad); align-self: flex-start; }
.pill { padding-top: 2px; padding-bottom: 2px; }
@media (max-width: 700px) {
  :root { --lh: 23px; }
  :root[data-vis="equilibree"] { --lnpad: 8.5px; }
  :root[data-vis="nette"] { --lnpad: 10.5px; }
  :root[data-vis="nette"] .ln.half { --lnpad: 6.5px; }
}
table.t td { vertical-align: top; }
table.t td textarea.w { padding: 6px; min-width: 70px; }
.glance .gc { align-items: flex-start; }
.glance .gc button { padding-top: 4px; }
.glance .gc textarea.w { padding: 4px 0; line-height: 1.3; }
.hourly .hc textarea.w { padding: 6px 4px; line-height: 1.3; }
.trk td.rl textarea.w { border-bottom: 1px solid var(--line); width: 140px; padding: 3px 0; }
.polaroid textarea.w { text-align: center; font-family: var(--f-serif); font-style: italic; }
/* ---------- couleur et taille de l'écriture ---------- */
/* stylos : chaque texte garde la couleur avec laquelle il a été écrit */
:root { --pen-encre: var(--ink); --pen-bleu: #2E4A72; --pen-bordeaux: #7E2F3D; --pen-foret: #2E5E49; --pen-rose: #B04F72; --pen-roseclair: #D9779F; --pen-corail: #D9604F; --pen-orange: #D06A14; --pen-jaune: #B08600; --pen-vert: #3A9248; --pen-turquoise: #16898A; --pen-violet: #7552AE; --pen-prune: #6E3A63; --write: var(--pen-encre); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pen-bleu: #A8C2E6; --pen-bordeaux: #E8A6B1; --pen-foret: #9FCDB6; --pen-rose: #F2B3C8; --pen-roseclair: #F8C6DA; --pen-corail: #F6A99E; --pen-orange: #F5A86A; --pen-jaune: #F0D060; --pen-vert: #8FD39A; --pen-turquoise: #8FD6D3; --pen-violet: #C7B3EC; --pen-prune: #D7A8CC; } }
:root[data-theme="dark"] { --pen-bleu: #A8C2E6; --pen-bordeaux: #E8A6B1; --pen-foret: #9FCDB6; --pen-rose: #F2B3C8; --pen-roseclair: #F8C6DA; --pen-corail: #F6A99E; --pen-orange: #F5A86A; --pen-jaune: #F0D060; --pen-vert: #8FD39A; --pen-turquoise: #8FD6D3; --pen-violet: #C7B3EC; --pen-prune: #D7A8CC; }
:root[data-wcolor="bleu"] { --write: var(--pen-bleu); }
:root[data-wcolor="bordeaux"] { --write: var(--pen-bordeaux); }
:root[data-wcolor="foret"] { --write: var(--pen-foret); }
:root[data-wcolor="rose"] { --write: var(--pen-rose); }
:root[data-wcolor="roseclair"] { --write: var(--pen-roseclair); }
:root[data-wcolor="corail"] { --write: var(--pen-corail); }
:root[data-wcolor="orange"] { --write: var(--pen-orange); }
:root[data-wcolor="jaune"] { --write: var(--pen-jaune); }
:root[data-wcolor="vert"] { --write: var(--pen-vert); }
:root[data-wcolor="turquoise"] { --write: var(--pen-turquoise); }
:root[data-wcolor="violet"] { --write: var(--pen-violet); }
:root[data-wcolor="prune"] { --write: var(--pen-prune); }
:is(input[type=text], input[type=search], textarea) { color: var(--fc, var(--write)); caret-color: var(--write); }
/* bouton stylo + palette */
.pen-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--write); box-shadow: 0 0 0 2px var(--sheet), 0 0 0 3px var(--rule, var(--line)); display: block; }
.penpop { position: fixed; z-index: 45; background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 8px; display: none; grid-template-columns: repeat(7, 38px); gap: 4px; box-shadow: 0 14px 30px -18px rgba(0,0,0,.45); }
.penpop.open { display: grid; }

.penpop button i { width: 20px; height: 20px; border-radius: 50%; display: block; }
.penpop button.on { box-shadow: inset 0 0 0 2px var(--deep); }
.penpop .lbl { grid-column: 1 / -1; padding: 2px 6px 4px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; white-space: nowrap; }
:root[data-wsize="petit"] { --lh: 20px; }
:root[data-wsize="grand"] { --lh: 27px; }

:root[data-wsize="petit"] :is(.ln, .fld, .kanban, .polaroid, .arch, .blk) :is(input[type=text], textarea.w, textarea.ta) { font-size: 13.5px; }
:root[data-wsize="petit"] table.t td :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="petit"] .hourly .hc :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="petit"] .trk td.rl :is(input[type=text], textarea.w, textarea.ta) { font-size: 12.5px; }
:root[data-wsize="petit"] .glance .gc :is(input[type=text], textarea.w, textarea.ta) { font-size: 10.5px; }
:root[data-wsize="grand"] :is(.ln, .fld, .kanban, .polaroid, .arch, .blk) :is(input[type=text], textarea.w, textarea.ta) { font-size: 18.5px; }
:root[data-wsize="grand"] textarea.ta { line-height: 34px; background-size: 100% 34px; background-image: linear-gradient(to bottom, transparent 33px, var(--rule) 33px); }
:root[data-wsize="grand"] textarea.ta:is(.box, .plain) { background-image: none; line-height: 1.55; }
:root[data-wsize="grand"] textarea.ta.dots { background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.7px); background-size: 22px 22px; line-height: 33px; }
:root[data-wsize="grand"] table.t td :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="grand"] .hourly .hc :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="grand"] .trk td.rl :is(input[type=text], textarea.w, textarea.ta) { font-size: 16.5px; }
:root[data-wsize="grand"] .glance .gc :is(input[type=text], textarea.w, textarea.ta) { font-size: 14px; }
@media (max-width: 700px) {
  /* sur téléphone, jamais sous 16 px (sinon l'iPhone zoome) */
  :root[data-wsize="petit"] { --lh: 23px; }
  :root[data-wsize="petit"] :is(.ln, .fld, .kanban, .polaroid, .arch, .blk) :is(input[type=text], textarea.w, textarea.ta),
  :root[data-wsize="petit"] table.t td :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="petit"] .hourly .hc :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="petit"] .trk td.rl :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="petit"] .glance .gc :is(input[type=text], textarea.w, textarea.ta) { font-size: 16px; }
  :root[data-wsize="moyen"] { --lh: 25px; }
  :root[data-wsize="moyen"] :is(.ln, .fld, .kanban, .polaroid, .arch, .blk) :is(input[type=text], textarea.w, textarea.ta) { font-size: 17.5px; }
  :root[data-wsize="grand"] { --lh: 29px; }
  :root[data-wsize="grand"] :is(.ln, .fld, .kanban, .polaroid, .arch, .blk) :is(input[type=text], textarea.w, textarea.ta) { font-size: 20px; }
  :root[data-wsize="grand"] table.t td :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="grand"] .hourly .hc :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="grand"] .trk td.rl :is(input[type=text], textarea.w, textarea.ta), :root[data-wsize="grand"] .glance .gc :is(input[type=text], textarea.w, textarea.ta) { font-size: 18px; }
}
/* ---------- prénom et photo de profil (en tête du sommaire) ---------- */

  margin-left: 14px; padding: 0 2px; width: auto; max-width: 100%; line-height: 1.1; font-size-adjust: none; letter-spacing: 0; vertical-align: baseline; }
.ph h1 .owner::placeholder { color: var(--acc); opacity: .45; font-style: italic; }

.prof { display: flex; align-items: center; gap: 20px; min-width: 0; }

@media (max-width: 700px) { .avatar { width: 72px; height: 72px; } .prof { gap: 14px; } .ph.profile h1 { font-size: 36px; } .ph.profile h1 .owner { max-width: 100%; } }
/* ---------- couverture ---------- */
.cover-page { display: grid; justify-items: center; gap: 22px; padding: 6px 0 10px; }
.cover-book { position: relative; display: block; width: min(100%, 520px); aspect-ratio: 3 / 4; border-radius: 4px 12px 12px 4px; overflow: hidden; container-type: size;
  background: var(--soft) center / cover no-repeat; background-image: var(--ct); box-shadow: 0 30px 50px -28px rgba(40, 30, 20, .55), 0 2px 6px rgba(0,0,0,.08); transition: transform .25s ease; }
@media (max-width: 700px) { .cover-book { background-image: var(--cp); aspect-ratio: 9 / 16; width: min(100%, 440px); } }
@media (min-width: 1101px) { .cover-book { background-image: var(--co); aspect-ratio: 16 / 9; width: 100%; border-radius: 6px; } .cover-book::before { display: none; } }

.cover-book::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4.5%; background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,0)); }
.plaque { position: absolute; left: 50%; transform: translate(-50%, -50%); top: 50%; min-width: 56cqmin; padding: 6.5cqmin 7cqmin 5.5cqmin; text-align: center; border-radius: 3px;
  background: rgba(251, 248, 243, .78); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); color: #4A3F37; box-shadow: 0 10px 30px -18px rgba(0,0,0,.45); }

@media (max-width: 700px) { .cover-book { width: min(100%, 420px); } .covers { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }
/* gouttes d'eau : toujours bleues, quels que soient le coloris et le thème */

/* légère ombre sur les blocs beige (cartes, encadrés) */

/* ---------- adaptation à tous les écrans (Android compris) ---------- */
/* Android et autres téléphones : rien ne peut dépasser sur les côtés (sinon Android dézoome la page).
   iPhone / iPad : comportement d'origine, sans aucune de ces règles (Safari les gère mal avec la barre du bas). */
@supports (overflow: clip) { html:not(.ios), html:not(.ios) body { overflow-x: clip; } }
html:not(.ios) .wrap { max-width: 100%; }
/* ---------- TÉLÉPHONE : structure « application » (correction du bug de la barre du bas sur iPhone) ----------
   Cause : la barre du bas était en « position: fixed », donc placée par rapport à la zone d'affichage de Safari.
   Depuis iOS 26, après l'ouverture/fermeture du clavier (et parfois au défilement), Safari garde une zone
   d'affichage faussée (visualViewport.height < innerHeight, offsetTop > 0 — bug WebKit 297779 / FB19889436) :
   tout ce qui est « fixed » est alors dessiné trop haut, d'où la barre au milieu et le grand vide dessous.
   Correction à la source : sur téléphone, plus aucun élément de mise en page en « fixed ». La page devient une
   colonne de hauteur écran : en-tête, contenu qui défile (seul), barre du bas. La page elle-même ne défile plus,
   Safari n'a donc plus rien à recalculer. Le design (couleurs, tailles, espacements) est inchangé.
   S'applique aux téléphones (même tournés en paysage) et aux tablettes tactiles ; l'ordinateur avec souris n'est pas concerné. */
@media (max-width: 700px), (hover: none) and (pointer: coarse) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  body::before, :root[data-tint] body::before { display: none; }
  body > header.top { position: relative; top: auto; flex: none; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  body > .wrap { flex: 1 1 auto; min-height: 0; align-items: flex-start; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; padding-bottom: 24px !important; }
  body > .bottombar { position: relative; left: auto; right: auto; bottom: auto; flex: none; }
  body > .wrap > .sheet { flex-shrink: 0; }
}


header.top { max-width: 100%; }
.brand { flex: 0 1 auto; min-width: 0; overflow: hidden; }
.brand b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { flex: none; }
.tool, .menu-btn { flex: none; aspect-ratio: 1 / 1; min-width: 0; }
.card.secedit { cursor: default; }
/* bouton central « Ajouter » de la barre du bas */
.bottombar .addbtn .addcircle { display: contents; }
.bottombar .addbtn::before { display: none !important; }
/* panneau d'ajout rapide */
.addsheet { position: fixed; inset: 0; z-index: 60; background: rgba(20, 18, 16, .38); display: none; }
.addsheet.open { display: block; }
.addpanel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); color: var(--ink); border-radius: 14px 14px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); max-height: 85%; overflow: auto; box-shadow: 0 -10px 30px -12px rgba(0,0,0,.3); }
@media (min-width: 701px) { .addpanel { left: 50%; right: auto; width: 520px; transform: translateX(-50%); bottom: 24px; border-radius: 14px; } }
.addgrip { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.addhead { position: sticky; top: -10px; z-index: 1; background: var(--sheet); display: flex; align-items: center; justify-content: space-between; padding: 6px 0 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.addhead b { font-family: var(--f-serif); font-weight: 500; font-size: 21px; letter-spacing: .01em; }
.addclose { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--deep); font-size: 15px; }
.addsub { font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 18px 2px 8px; }
.addgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.addgrid button { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); text-align: left; min-width: 0; color: var(--ink); transition: background .15s, border-color .15s; }
.addgrid button .ai { width: 32px; height: 32px; border-radius: 7px; background: var(--soft); display: grid; place-items: center; color: var(--acc); flex: none; font-size: 16px; }
.addgrid button b { display: block; font-weight: 600; font-size: 14px; line-height: 1.25; letter-spacing: .005em; }
.addgrid button small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addgrid button span:last-child { min-width: 0; }
.addgrid button:last-child:nth-child(odd) { grid-column: 1 / -1; }
.addnav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.addnav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 64px; padding: 10px 4px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-size: 12px; font-weight: 500; letter-spacing: .01em; line-height: 1.2; text-align: center; min-width: 0; overflow-wrap: anywhere; transition: background .15s, border-color .15s; }
.addnav button .ai { font-size: 17px; color: var(--acc); line-height: 0; }
.addnav button.on { background: var(--soft); border-color: var(--acc); }
.addgrid button:active, .addnav button:active { background: var(--soft); }
@media (hover: hover) { .addgrid button:hover, .addnav button:hover { border-color: var(--acc); } }
@media (min-width: 701px) { .addnav { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.sechead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sechead .lab, .sechead > div > * { margin-bottom: 0 !important; }
.secedit-btn { flex: none; font: inherit; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--deep) 35%, transparent); background: transparent; color: var(--deep); line-height: 1.2; position: relative; }
.secedit-btn::before { content: ""; position: absolute; inset: -8px -4px; }
.secedit-btn.on { background: var(--deep); color: var(--sheet); border-color: var(--deep); }
.secbtns { display: flex; gap: 6px; flex: none; }
.secb { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); color: var(--deep); font-size: 15px; display: grid; place-items: center; flex: none; }

@media (max-width: 480px) { .card.secedit { padding: 12px; gap: 10px; } .card.secedit small { display: none; } .secbtns { gap: 4px; } .secb { width: 34px; height: 34px; } }
.styles { max-width: 100%; }
@media (max-width: 700px) {
  .phr { width: 100%; }
  .styles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; box-sizing: border-box; }
  .styles button { padding: 9px 2px; letter-spacing: .06em; white-space: nowrap; min-width: 0; }

  .styles { grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 18px; gap: 2px; }

}
/* zones tactiles plus grandes pour les petits liens, sans changer l'apparence */

/* ================= rendu des blocs ================= */
let PK = '';           // page courante
let uid = 0;
function blocks(arr, pfx) { return arr.map((b, i) => block(b, (pfx || '') + (b.id || ('b' + i)))).join(''); }
function lab(b) { return b.l ? `<div class="lab">${b.ic ? ic(b.ic) : ''}<span>${esc(b.l)}</span></div>` : ''; }
function block(b, id) {
  const k = id;
  let h = '';
  switch (b.t) {
    case 'lines': for (let i = 0; i < b.n; i++) h += `<div class="ln"><input type="text" data-k="${k}.${i}" value="${esc(getv(PK, k + '.' + i, ''))}" aria-label="${esc(b.l || 'ligne')} ${i + 1}"></div>`; break;
    case 'num': for (let i = 0; i < b.n; i++) h += `<div class="ln${b.pill ? ' pill' : ''}"><span class="n">${i + 1}</span><input type="text" data-k="${k}.${i}" value="${esc(getv(PK, k + '.' + i, ''))}" aria-label="${i + 1}"></div>`; break;
    case 'checks': for (let i = 0; i < b.n; i++) { const c = getv(PK, k + '.' + i + 'c', false); const def = b.pre && b.pre[i] ? b.pre[i] : ''; const v = getv(PK, k + '.' + i, def);
      h += `<div class="ln${c ? ' done' : ''}">${b.time ? `<input type="text" style="flex:0 0 52px" placeholder="--:--" data-k="${k}.${i}h" value="${esc(getv(PK, k + '.' + i + 'h', ''))}" aria-label="heure">` : ''}<input type="checkbox" class="ck${b.round ? ' r' : ''}" data-k="${k}.${i}c" ${c ? 'checked' : ''} aria-label="fait"><input type="text" data-k="${k}.${i}" data-def="${esc(def)}" value="${esc(v)}" aria-label="élément ${i + 1}"></div>`; } break;
    case 'area': h += `${b.head ? `<div class="ln"><input type="text" data-k="${k}.h" value="${esc(getv(PK, k + '.h', ''))}" placeholder="Titre" aria-label="titre"></div>` : ''}<textarea class="ta ${b.cls || ''}" rows="${b.rows || 4}" style="min-height:${(b.rows || 4) * 28 + (b.cls === 'box' || b.cls === 'plain' ? 20 : 0)}px" data-k="${k}" aria-label="${esc(b.l || 'notes')}">${esc(getv(PK, k, ''))}</textarea>`; break;
    case 'fields': h += b.f.map((f, i) => `<div class="fld"><label for="f-${k}-${i}">${esc(f)}</label><input id="f-${k}-${i}" type="text" data-k="${k}.${i}" value="${esc(getv(PK, k + '.' + i, ''))}"></div>`).join(''); break;
    case 'table': h += table(b, k); break;
    case 'tracker': h += tracker(b, k); break;
    case 'mood': { const v = getv(PK, k, ''); h += `<div class="row mood">${['super', 'bien', 'bof', 'triste', 'fatigue'].map(m => `<button type="button" data-set="${k}" data-val="${m}" class="${v === m ? 'on' : ''}" aria-label="${m}">${moodFace(m)}</button>`).join('')}</div>`; break; }
    case 'water': { h += `<div class="row">${Array.from({ length: b.n || 8 }, (_, i) => `<button type="button" class="drop${getv(PK, k + '.' + i, false) ? ' on' : ''}" data-tog="${k}.${i}" aria-label="verre ${i + 1}">${ic('water')}</button>`).join('')}</div>`; break; }
    case 'dots': { const v = getv(PK, k, 0); h += `<div class="row dot10">${Array.from({ length: b.n || 10 }, (_, i) => `<button type="button" data-set="${k}" data-val="${i + 1}" class="${v >= i + 1 ? 'on' : ''}">${i + 1}</button>`).join('')}</div>`; break; }
    case 'stars': { const v = getv(PK, k, 0); h += `<div class="row stars">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-set="${k}" data-val="${i}" class="${v >= i ? 'on' : ''}" aria-label="${i} étoile">${ic('star')}</button>`).join('')}</div>`; break; }
    case 'progress': { const v = getv(PK, k, 0); h += `<div class="prog">${Array.from({ length: 10 }, (_, i) => `<button type="button" data-set="${k}" data-val="${i + 1}" class="${v >= i + 1 ? 'on' : ''}" aria-label="${(i + 1) * 10} %"></button>`).join('')}</div><p class="hint" style="margin-top:4px">${v * 10} %</p>`; break; }
    case 'photo': h += photo(k, b.ratio); break;
    case 'photos': h += `<div class="photos" style="grid-template-columns:repeat(${b.cols},minmax(0,1fr))">${Array.from({ length: b.n }, (_, i) => b.polaroid ? `<div class="polaroid">${photo(k + '.' + i, b.ratio)}<input type="text" data-k="${k}.${i}t" value="${esc(getv(PK, k + '.' + i + 't', b.captions ? b.captions[i] : ''))}" aria-label="légende"></div>` : `<div style="position:relative">${photo(k + '.' + i, b.ratio)}${b.numbered ? `<span class="caps" style="position:absolute;right:6px;bottom:4px;z-index:2">${i + 1}</span>` : ''}</div>`).join('')}</div>`; break;
    case 'schedule': for (let hh = b.from; hh <= b.to; hh++) { h += `<div class="ln"><span class="hr">${pad(hh)}</span><input type="text" data-k="${k}.${hh}" value="${esc(getv(PK, k + '.' + hh, ''))}" aria-label="${hh} h"></div><div class="ln half"><span class="hr"></span><input type="text" data-k="${k}.${hh}h" value="${esc(getv(PK, k + '.' + hh + 'h', ''))}" aria-label="${hh} h 30"></div>`; } break;
    case 'static': h += `<div class="static">${b.html}</div>`; break;
    case 'grid2': h += `<div class="grid2${b.w ? ' w' : ''}"><div class="col">${blocks(b.a, k + 'a')}</div><div class="col">${blocks(b.b, k + 'b')}</div></div>`; break;
    case 'group': h += `<div class="full" style="margin-top:0">${blocks(b.items, k)}</div>`; break;
    case 'kanban': h += `<div class="kanban">${[['À faire', 'todo'], ['En cours', 'timer'], ['Terminé', 'trophy']].map(([t, i], c) => `<div>${lab({ l: t, ic: i })}${Array.from({ length: 6 }, (_, r) => `<textarea data-k="${k}.${c}.${r}" aria-label="${t} ${r + 1}">${esc(getv(PK, k + '.' + c + '.' + r, ''))}</textarea>`).join('')}</div>`).join('')}</div>`; break;
    case 'wheel': h += `<div class="wheel">${b.rows.map((r, i) => { const v = getv(PK, k + '.' + i, 5); return `<span class="caps" style="color:var(--deep)">${r}</span><input type="range" min="1" max="10" value="${v}" data-k="${k}.${i}" data-num="1" aria-label="${r}"><span class="serif" style="font-size:18px" data-out="${k}.${i}">${v}</span>`; }).join('')}</div>`; break;
    case 'defi': { let tot = 0; for (let i = 1; i <= 52; i++) if (getv(PK, k + '.' + i, false)) tot += i;

const vEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');

const TINTED = ['lavande', 'sauge', 'rose', 'framboise', 'demoiselle', 'crepuscule'];
function syncBarColor() {
  try {
    const top = document.querySelector('header.top'); if (!top) return;
    const r = document.documentElement;
    if (!TINTED.includes((S.settings || {}).coloris)) {
      delete r.dataset.tint; delete r.dataset.bar; ['--bar-bg', '--bar-line', '--bar-ink', '--bar-icon'].forEach(v => r.style.removeProperty(v));
      const m0 = document.getElementById('meta-theme'); if (m0) { const c0 = getComputedStyle(top).backgroundColor; m0.setAttribute('content', c0); }
      return;
    }
    r.dataset.tint = '1';
    const cv = document.createElement('canvas'); cv.width = cv.height = 1; const x = cv.getContext('2d', { willReadFrequently: true });
    const rgb = c => { x.clearRect(0, 0, 1, 1); x.fillStyle = '#000'; x.fillStyle = c; x.fillRect(0, 0, 1, 1); const d = x.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2]]; };

    const ratio = (a, b) => { const p = lum(a), q = lum(b); return (Math.max(p, q) + .05) / (Math.min(p, q) + .05); };
    const hex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');

    const cs0 = getComputedStyle(r), box = cs0.getPropertyValue('--box').trim(), soft = cs0.getPropertyValue('--soft').trim(), tab = cs0.getPropertyValue('--tab').trim();
    const blocks = [box, soft, tab].map(v => v && rgb(v)).filter(Boolean).find(v => lum(v) < .3);
    if (blocks && lum(rgb(cs0.getPropertyValue('--bg').trim() || '#fff')) > .5) { let k = blocks; for (let i = 0; i < 25 && ratio([255, 255, 255], k) < 4.6; i++) k = k.map(v => v * .96); r.style.setProperty('--bar-bg', hex(k)); r.style.setProperty('--bar-line', 'transparent'); }
    else { r.style.removeProperty('--bar-bg'); r.style.removeProperty('--bar-line'); }

    const dark = lum(bg) < .3, toward = dark ? [255, 255, 255] : [20, 18, 17];
    r.dataset.bar = dark ? 'dark' : 'light';
    const fit = (c, min) => { for (let t = 0; t <= 1.0001; t += .04) { const m = c.map((v, i) => v + (toward[i] - v) * t); if (ratio(m, bg) >= min) return hex(m); } return hex(toward); };
    const cs = getComputedStyle(r);
    const acc = rgb(cs.getPropertyValue('--acc').trim() || '#8a7f74'), deep = rgb(cs.getPropertyValue('--deep').trim() || '#3a3330');
    if (dark) {
      /* coloris foncé : textes et pictos en blanc */
      r.style.setProperty('--bar-ink', '#FFFFFF');
      r.style.setProperty('--bar-icon', fit(bg.map(v => v + (255 - v) * .78), 4.6));
    } else {
      r.style.setProperty('--bar-ink', fit(deep, 7));
      r.style.setProperty('--bar-icon', fit(acc, 4.6));
    }
    const m = document.getElementById('meta-theme'); if (m) m.setAttribute('content', hex(bg));
  } catch (e) {}
}

ete cycles are needed to draw the history.","Se necesitan al menos 2 ciclos completos para trazar el historial.","يلزم دورتان كاملتان على الأقل لرسم السجل.","इतिहास दिखाने के लिए कम से कम 2 पूरे चक्र चाहिए।"],["Durée des règles","Period length","Duración de la regla","مدة الدورة الشهرية","पीरियड की अवधि"],["Enregistre tes règles pour voir leur durée.","Log your period to see its length.","Registra tu regla para ver su duración.","سجّلي دورتك لرؤية مدتها.","अवधि देखने के लिए अपना पीरियड दर्ज करें।"],["Intensité du flux","Flow intensity","Intensidad del flujo","شدة التدفق","प्रवाह की तीव्रता"],["Plus la case est foncée, plus le flux était abondant (léger → très abondant).","The darker the box, the heavier the flow (light → very heavy).","Cuanto más oscura la casilla, más abundante el flujo (ligero → muy abundante).","كلما كانت الخانة أغمق كان التدفق أغزر (خفيف ← غزير جدًا).","बॉक्स जितना गहरा, प्रवाह उतना भारी (हल्का → बहुत भारी)।"],["Aucun flux enregistré sur cette période.","No flow logged in this period.","Ningún flujo registrado en este periodo.","لم يُسجَّل تدفق في هذه الفترة.","इस अवधि में कोई प्रवाह दर्ज नहीं।"],["Évolution des symptômes","Symptoms over time","Evolución de los síntomas","تطور الأعراض","लक्षणों में बदलाव"],["Nombre de jours avec ce symptôme, cycle par cycle (date de début en haut).","Number of days with this symptom, cycle by cycle (start date at the top).","Número de días con este síntoma, ciclo a ciclo (fecha de inicio arriba).","عدد الأيام مع هذا العرض لكل دورة (تاريخ البداية في الأعلى).","हर चक्र में इस लक्षण वाले दिन (ऊपर शुरुआत की तारीख)।"],["Aucun symptôme enregistré sur cette période.","No symptoms logged in this period.","Ningún síntoma registrado en este periodo.","لم تُسجَّل أعراض في هذه الفترة.","इस अवधि में कोई लक्षण दर्ज नहीं।"],["Humeur et cycle","Mood & cycle","Humor y ciclo","المزاج والدورة","मूड और चक्र"],["Chaque point = une humeur notée ce jour-là du cycle. Aucune interprétation médicale n’est tirée de ces données.","Each dot = a mood logged on that cycle day. No medical interpretation is drawn from this data.","Cada punto = un humor anotado ese día del ciclo. No se saca ninguna interpretación médica de estos datos.","كل نقطة = مزاج سُجّل في ذلك اليوم من الدورة. لا يُستخلص أي تفسير طبي من هذه البيانات.","हर बिंदु = चक्र के उस दिन दर्ज मूड। इन आँकड़ों से कोई चिकित्सीय निष्कर्ष नहीं निकाला जाता।"],["Note ton humeur dans « Ma journée » pour voir ce graphique.","Log your mood in “My day” to see this chart.","Anota tu humor en «Mi día» para ver este gráfico.","سجّلي مزاجك في «يومي» لرؤية هذا الرسم.","यह चार्ट देखने के लिए “मेरा दिन” में अपना मूड दर्ज करें।"],["Note tes douleurs (0 à 10) sur au moins 2 jours.","Log your pain (0 to 10) on at least 2 days.","Anota tu dolor (0 a 10) al menos 2 días.","سجّلي الألم (0 إلى 10) في يومين على الأقل.","कम से कम 2 दिन अपना दर्द (0 से 10) दर्ज करें।"],["Régularité","Regularity","Regularidad","الانتظام","नियमितता"],["Écart de chaque cycle par rapport à ta moyenne (0 = cycle moyen).","How far each cycle is from your average (0 = average cycle).","Diferencia de cada ciclo respecto a tu media (0 = ciclo medio).","فرق كل دورة عن متوسطك (0 = دورة متوسطة).","हर चक्र का आपके औसत से अंतर (0 = औसत चक्र)।"],["Il faut au moins 2 cycles complets.","At least 2 complete cycles are needed.","Se necesitan al menos 2 ciclos completos.","يلزم دورتان كاملتان على الأقل.","कम से कम 2 पूरे चक्र चाहिए।"],["Choisis les graphiques à afficher dans Réglages du cycle. Les données affichées sont uniquement les tiennes.","Choose which charts to show in Cycle settings. Only your own data is shown.","Elige los gráficos que quieres ver en Ajustes del ciclo. Solo se muestran tus datos.","اختاري الرسوم المعروضة في إعدادات الدورة. البيانات المعروضة هي بياناتك فقط.","चक्र सेटिंग्स में दिखाए जाने वाले चार्ट चुनें। केवल आपका डेटा दिखता है।"],["Estimations à partir de tes cycles","Estimates based on your cycles","Estimaciones a partir de tus ciclos","تقديرات بناءً على دوراتك","आपके चक्रों पर आधारित अनुमान"],["Enregistre le premier jour de tes règles dans « Ma journée » : les prévisions apparaîtront ici.","Log the first day of your period in “My day”: forecasts will appear here.","Registra el primer día de tu regla en «Mi día»: las previsiones aparecerán aquí.","سجّلي أول يوم من دورتك في «يومي»: ستظهر التوقعات هنا.","“मेरा दिन” में अपने पीरियड का पहला दिन दर्ज करें: अनुमान यहाँ दिखेंगे।"],["Prochaines règles probables","Most likely next period","Próxima regla probable","الدورة القادمة المرجحة","संभावित अगला पीरियड"],["Durée moyenne","Average length","Duración media","المتوسط","औसत अवधि"],["jours en moyenne","days on average","días de media","أيام في المتوسط","औसतन दिन"],["Fiabilité","Reliability","Fiabilidad","الموثوقية","विश्वसनीयता"],["Bonne","Good","Buena","جيدة","अच्छी"],["Faible","Low","Baja","ضعيفة","कम"],["Prochains cycles estimés","Next estimated cycles","Próximos ciclos estimados","الدورات القادمة المقدرة","अगले अनुमानित चक्र"],["prochain","next","próximo","القادم","अगला"],["Estimation théorique (14 jours avant les règles prévues). Elle peut être très différente de la réalité et ne doit jamais servir de contraception.","Theoretical estimate (14 days before the expected period). It can be very different from reality and must never be used as contraception.","Estimación teórica (14 días antes de la regla prevista). Puede ser muy diferente de la realidad y nunca debe usarse como anticonceptivo.","تقدير نظري (14 يومًا قبل الدورة المتوقعة). قد يختلف كثيرًا عن الواقع ولا يجب استخدامه أبدًا كوسيلة منع حمل.","सैद्धांतिक अनुमान (अपेक्षित पीरियड से 14 दिन पहले)। यह वास्तविकता से बहुत अलग हो सकता है और इसे कभी गर्भनिरोधक के रूप में इस्तेमाल न करें।"],["Historique utilisé pour le calcul","History used for the calculation","Historial usado para el cálculo","السجل المستخدم في الحساب","गणना में इस्तेमाल इतिहास"],["Les prévisions sont approximatives. Elles ne sont ni un diagnostic médical ni une méthode de contraception. En cas de doute, demande conseil à un prof /* ===== Glissement tactile : page suivante / précédente =====
   Glisser vers la gauche = page suivante, vers la droite = page précédente (inversé en arabe).
   Ignoré dans les zones qui défilent déjà horizontalement, les champs de saisie et les bords de l’écran. */
(() => {
  const NO = 'select,input[type=range],input[type=date],input[type=time],button.cydot,[contenteditable="true"],.rcar,.rrow,.cynav,.addsheet,.drawer,.updbar,.cypain,svg.cyring';
  let st = null;
  const pageEl = () => document.getElementById('page');
  function arrows() {
    const a = document.querySelector('#page .ph .arrows'); if (a) { const b = a.querySelectorAll('button'); return [b[0], b[1]]; }
    const c = document.querySelector('#page .cyday-nav'); if (c) return [c.firstElementChild, c.lastElementChild];
    return null;
  }
  function scrollsX(el) { for (let e = el; e && e !== document.body; e = e.parentElement) { if (e.scrollWidth > e.clientWidth + 2) { const o = getComputedStyle(e).overflowX; if (o === 'auto' || o === 'scroll') return true; } } return false; }
  document.addEventListener('touchstart', e => {
    st = null; if (e.touches.length !== 1) return; const t = e.touches[0]; const tg = e.target;
    if (!tg.closest || !tg.closest('#page') || tg.closest(NO) || scrollsX(tg)) return;
    if (document.activeElement && document.activeElement !== document.body && document.activeElement.contains(tg) && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (t.clientX < 22 || t.clientX > innerWidth - 22) return;
    const a = arrows(); if (!a) return;
    st = { x: t.clientX, y: t.clientY, t: Date.now(), a, h: null };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!st || e.touches.length !== 1) return; const t = e.touches[0]; const dx = t.clientX - st.x, dy = t.clientY - st.y;
    if (st.h === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) st.h = Math.abs(dx) > Math.abs(dy) * 1.4;
    if (!st.h) return;
    const rtl = document.documentElement.dir === 'rtl'; const btn = (dx < 0) !== rtl ? st.a[1] : st.a[0]; const can = btn && !btn.disabled;
    const p = pageEl(); if (p) { p.style.transition = 'none'; p.style.transform = `translateX(${dx * (can ? .35 : .12)}px)`; p.style.opacity = String(1 - Math.min(.35, Math.abs(dx) / 900)); }
  }, { passive: true });
  function reset(p) { if (!p) return; p.style.transition = 'transform .22s ease, opacity .22s ease'; p.style.transform = ''; p.style.opacity = ''; setTimeout(() => { p.style.transition = ''; }, 260); }
  document.addEventListener('touchend', e => {
    const s = st; st = null; if (!s) return; const t = e.changedTouches[0]; const dx = t.clientX - s.x, dy = t.clientY - s.y, dt = Date.now() - s.t; const p = pageEl();
    const fast = Math.abs(dx) > 45 && dt < 300, far = Math.abs(dx) > 90;
    if (!s.h || !(fast || far) || Math.abs(dx) < Math.abs(dy) * 1.4 || (window.getSelection && String(window.getSelection()))) { reset(p); return; }
    const rtl = document.documentElement.dir === 'rtl'; const next = (dx < 0) !== rtl; const btn = next ? s.a[1] : s.a[0];
    if (!btn || btn.disabled) { reset(p); return; }
    if (p) { p.style.transition = ''; p.style.transform = ''; p.style.opacity = ''; }
    btn.click();
    const q = pageEl(); if (q && !matchMedia('(prefers-reduced-motion: reduce)').matches) { q.classList.remove('swin-l', 'swin-r'); void q.offsetWidth; q.classList.add(next !== rtl ? 'swin-l' : 'swin-r'); setTimeout(() => q.classList.remove('swin-l', 'swin-r'), 320); }
    try { if (!localStorage.getItem('agenda-swipe-ok')) localStorage.setItem('agenda-swipe-ok', '1'); } catch (_) {}
  }, { passive: true });
  document.addEventListener('touchcancel', () => { if (st) reset(pageEl()); st = null; }, { passive: true });
  /* astuce affichée une seule fois sur un écran tactile */
  setTimeout(() => { try { if (matchMedia('(pointer: coarse)').matches && !localStorage.getItem('agenda-swipe-ok') && !localStorage.getItem('agenda-swipe-tip') && arrows()) { localStorage.setItem('agenda-swipe-tip', '1'); toast('Astuce : glisse vers la gauche ou la droite pour changer de page'); } } catch (_) {} }, 2500);
})();

      let tried = null; try { tried = sessionStorage.getItem('agenda-upd'); } catch (e) {}
      if (manual) { applyUpdate(); return; }
      if (tried === APP_BUILD) return;
      const a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) updBar(true); else applyUpdate();
      return;
    }
    if (manual) toast('Ton agenda est à jour');
  } catch (e) { if (manual) toast('Vérification impossible : vérifie ta connexion'); }
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-doupd]')) { applyUpdate(); return; }
  if (e.target.closest('[data-checkupd]')) checkUpdate(true);
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(false); });
setTimeout(() => checkUpdate(false), 4000);
setInterval(() => { if (document.visibilityState === 'visible') checkUpdate(false); }, 30 * 60 * 1000);
applyLang();
render();
</script>
</body>
</html>
